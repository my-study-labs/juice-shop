name: DevSecOps Lab Pipeline

on:
  push:
    branches-ignore:
      - l10n_develop
      - gh-pages
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'monitoring/grafana-dashboard.json'
      - 'screenshots/**'
    tags-ignore:
      - '*'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'data/static/i18n/*.json'
      - 'frontend/src/assets/i18n/*.json'

jobs:
  job-1-secret-scanning:
    name: 1. CI - Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 1. CI - Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  job-2-sast-scanning:
    name: 2. CI - SAST Scanning
    needs: job-1-secret-scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 2. CI - SAST Scanning (Semgrep)
        uses: semgrep/semgrep-action@v6
        with:
          config: "p/default"
          generateSarif: "1" # Este parâmetro nativo gera automaticamente o arquivo semgrep.sarif
        continue-on-error: true

      # Adicione esta etapa logo abaixo para garantir que o resultado apareça na aba "Security" do GitHub
      - name: Upload Semgrep Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  job-3-sca-scanning:
    name: 3. CI - SCA Scanning
    needs: job-2-sast-scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 3. CI - SCA Scanning (Trivy Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy FS Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  job-4-iac-scanning:
    name: 4. CI - IaC Scanning
    needs: job-3-sca-scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 4. CI - IaC Scanning (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          output_format: sarif
          output_file_path: checkov.sarif
        continue-on-error: true

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  job-5-container-and-dast:
    name: 5. CI/CD - Container and DAST Scanning
    needs: job-4-iac-scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t my-app:latest .

      - name: 5. CI - Container Scanning (Trivy Image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'my-app:latest'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Image Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Run Application for DAST
        run: docker run -d -p 3000:3000 my-app:latest

      - name: Wait for app to start
        run: sleep 15

      - name: 6. CD - DAST Scanning (OWASP ZAP)
        # uses: zaproxy/action-baseline@v0.15.0
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:3000'
          fail_action: false